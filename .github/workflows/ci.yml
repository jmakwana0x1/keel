name: ci

on:
  push:
  pull_request:

jobs:
  numbers:
    # Every published Phase 0 number is regenerated from committed inputs; any drift fails the build.
    # model.py also refuses to emit if its own preconditions fail (quoter diff mismatch, thin sample).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r sim/requirements.txt
      - run: cd sim && python model.py
      - run: git diff --exit-code data/

  build:
    # Libraries are internal and compile into the hook: one oversized artifact is undeployable and no test sees it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - run: forge build --sizes

  test:
    # The suite under profile.ci, then the independent saturation check, then: regenerated artifacts must not drift.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r sim/requirements.txt
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - run: FOUNDRY_PROFILE=ci forge test
      - run: python3 sim/check_phase1_saturation.py
      - run: git diff --exit-code data/phase1_saturation_solidity.csv data/phase1_contribution.json data/phase1_gas.json

  absence:
    # The Cannot list, as text. Comment lines are filtered FIRST: a codebase that documents its own virtues would
    # otherwise satisfy a naive grep on documentation alone (rule 6).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          hits=$(find src -name '*.sol' -print0 | xargs -0 cat \
            | grep -vE '^\s*(//|/\*|\*)' \
            | grep -nE '\b(selfdestruct|delegatecall|onlyOwner|sweep|rescue)\b|\bassembly\b' || true)
          if [ -n "$hits" ]; then echo "$hits"; exit 1; fi
          echo "absence: none of selfdestruct, delegatecall, onlyOwner, sweep, rescue, inline assembly in src/"
